              - paragraph [ref=e686]: "Areas with persistently low ESI values — where actual evapotranspiration falls short of atmospheric demand — indicate zones under higher relative water stress. The pattern suggests these are not randomly distributed and may warrant closer monitoring. Note: 2024 ET and ESI data are low confidence (2 ECOSTRESS overpasses only)."
            - generic [ref=e688]: stress watch
