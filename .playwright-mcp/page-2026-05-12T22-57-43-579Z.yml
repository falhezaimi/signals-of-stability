              - heading "A terrain-structured ecological mosaic" [level=3] [ref=e660]
              - paragraph [ref=e661]: The April–June ECOSTRESS/AppEEARS signal across 2019–2025 does not show uniform distribution across the park. The evidence suggests ecological classes — stable cores, demand-efficiency zones, and stress watch areas — follow terrain structure rather than appearing randomly. Swiss National Park does not behave like a single homogeneous green landscape.
            - generic [ref=e663]: structure
          - generic [ref=e666]:
            - img [ref=e669]
            - generic [ref=e671]:
              - heading "Stable core locations persist through time" [level=3] [ref=e672]
              - paragraph [ref=e673]: Certain pixel clusters show consistent high-ESI, moderate-ET patterns across multiple seasons. This points to zones where vegetation appears to be reliably meeting atmospheric water demand, potentially corresponding to sheltered valley corridors or areas with mature canopy cover. These are directional signals — not confirmed stable zones pending field validation.
            - generic [ref=e675]: stable cores
          - generic [ref=e678]:
