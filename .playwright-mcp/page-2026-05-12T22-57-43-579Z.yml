          - paragraph [ref=e1387]: Stability in this landscape is not randomly distributed. The satellite signal suggests it follows terrain — concentrated where shelter and water converge, under pressure where atmospheric demand exceeds soil moisture capacity.
          - paragraph [ref=e1388]: Seven April–June seasons of ECOSTRESS/AppEEARS data give a directional reading, not a confirmed trend. Whether this pattern holds — and whether the watch zones are precursors to broader change — requires ground validation, additional seasons, and targeted monitoring.
