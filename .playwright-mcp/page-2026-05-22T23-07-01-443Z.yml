        - heading "What the signals suggest" [level=2] [ref=e738]
        - paragraph [ref=e739]: Five careful observations from short-window ECOSTRESS-derived signal analysis. These are evidence-based observations, not ecological conclusions.
      - generic [ref=e740]:
        - generic [ref=e742]:
          - generic [ref=e743]: "01"
          - generic [ref=e744]:
            - generic [ref=e745]:
              - heading "Time-of-day separation matters" [level=3] [ref=e746]
              - generic [ref=e747]: Time-bin sensitive
            - paragraph [ref=e748]: ECOSTRESS observations occur at different times of day. Because vegetation stress signals can shift between morning, midday, evening, and night, patterns should be compared across time bins before drawing conclusions. A signal visible only in one time bin may reflect observation timing rather than landscape condition.
        - generic [ref=e750]:
          - generic [ref=e751]: "02"
          - generic [ref=e752]:
            - generic [ref=e753]:
              - heading "Coverage affects confidence" [level=3] [ref=e754]
              - generic [ref=e755]: Coverage-sensitive
            - paragraph [ref=e756]: Outputs with low AOI pixel coverage or limited observation counts should be interpreted cautiously, even if the visual pattern appears strong. The coverage_inside_aoi_percent and observation_count fields are the primary quality indicators for each output.
        - generic [ref=e758]:
          - generic [ref=e759]: "03"
          - generic [ref=e760]:
            - generic [ref=e761]:
              - heading "Products capture different parts of vegetation stress" [level=3] [ref=e762]
              - generic [ref=e763]: Multi-product check
            - paragraph [ref=e764]: ESI, ET, NDVI, PET, and WUE each measure a different dimension of vegetation-water-energy behavior. Patterns that appear in only one product should be treated as candidate signals, not conclusions. Agreement across multiple products increases interpretive weight.
        - generic [ref=e766]:
          - generic [ref=e767]: "04"
          - generic [ref=e768]:
            - generic [ref=e769]:
              - heading "Some areas show repeated short-window signal differences" [level=3] [ref=e770]
              - generic [ref=e771]: Candidate signal
            - paragraph [ref=e772]: Certain locations appear consistently different from the AOI mean across multiple products and years. These areas are candidates for closer review. They do not automatically indicate ecological damage, decline, or long-term change.
        - generic [ref=e774]:
          - generic [ref=e775]: "05"
          - generic [ref=e776]:
            - generic [ref=e777]:
              - heading "This atlas is strongest as a discussion tool" [level=3] [ref=e778]
              - generic [ref=e779]: Exploratory use
            - paragraph [ref=e780]: The outputs are designed to make short-window vegetation stress signals visible, comparable, and scientifically discussable. They are exploratory in nature. Independent field validation, longer monitoring periods, and ecological context are all needed before drawing firm conclusions.
      - paragraph [ref=e782]: Short-window raster-derived ECOSTRESS/AppEEARS signals · January–June observations · 2019–2025 · Exploratory research prototype · Independent validation pending
