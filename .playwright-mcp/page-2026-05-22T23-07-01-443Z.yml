      - generic [ref=e315]: Five Environmental Variables
      - generic [ref=e317]:
        - generic [ref=e319]:
          - generic [ref=e320]: ESI
          - heading "Evaporative Stress Index" [level=3] [ref=e322]
          - paragraph [ref=e323]: ESI is used as a vegetation-water-stress signal. Lower or more stressed ESI patterns may suggest areas where vegetation is experiencing reduced evaporative function relative to available observations.
          - paragraph [ref=e325]: "Caution: ESI can support stress interpretation, but it does not prove cause by itself."
        - generic [ref=e327]:
          - generic [ref=e328]: ET
          - heading "Evapotranspiration" [level=3] [ref=e330]
          - paragraph [ref=e331]: ET represents water movement from land and vegetation into the atmosphere. In this atlas, ET helps show where vegetation-water activity appears stronger or weaker across available ECOSTRESS observations.
          - paragraph [ref=e333]: "Caution: ET patterns depend on vegetation, weather, soil moisture, overpass timing, and data coverage."
        - generic [ref=e335]:
          - generic [ref=e336]: NDVI
          - heading "Normalized Difference Vegetation Index" [level=3] [ref=e338]
          - paragraph [ref=e339]: NDVI provides a greenness-related vegetation signal. It helps identify areas with relatively higher or lower vegetation activity during the available January–June window.
          - paragraph [ref=e341]: "Caution: Greenness alone does not explain water stress or ecosystem condition."
        - generic [ref=e343]:
          - generic [ref=e344]: PET
          - heading "Potential Evapotranspiration" [level=3] [ref=e346]
          - paragraph [ref=e347]: PET represents atmospheric demand for water. It helps contextualize stress by showing where the atmosphere may be demanding more water from the surface.
          - paragraph [ref=e349]: "Caution: PET should be interpreted alongside ET, ESI, and observation coverage."
        - generic [ref=e351]:
          - generic [ref=e352]: WUE
          - heading "Water Use Efficiency" [level=3] [ref=e354]
          - paragraph [ref=e355]: WUE relates vegetation function to water use. In this atlas, it helps explore where vegetation may appear more or less efficient under the available short-window observations.
          - paragraph [ref=e357]: "Caution: WUE can be sensitive to calculation method, data quality, and valid-pixel coverage."
        - generic [ref=e359]:
          - paragraph [ref=e360]: Interpretation note
          - paragraph [ref=e361]: "The strongest interpretations survive four checks: sufficient observations, strong AOI coverage, consistent time-bin behavior, and agreement across multiple products."
      - paragraph [ref=e362]: ECOSTRESS-derived products · ESI, ET, NDVI, PET, WUE · Short-window raster-derived analysis · Exploratory use only
    - generic [ref=e366]:
      - generic [ref=e369]: Early signal pattern
      - heading "Signal structure, not uniform distribution." [level=2] [ref=e370]
      - paragraph [ref=e371]: "Swiss National Park does not appear as a uniform green landscape in these observations. ECOSTRESS-derived signals from available January–June scenes point to spatially structured patterns: high-ESI areas, elevated-stress areas, and variable-demand areas emerge across the atlas outputs. These are short-window signal patterns — not confirmed ecological classifications."
