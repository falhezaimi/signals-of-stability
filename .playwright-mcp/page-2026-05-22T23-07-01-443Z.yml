        - generic [ref=e279]: Atlas Overview
        - heading "What this atlas shows" [level=2] [ref=e280]
        - paragraph [ref=e281]: This atlas shows how vegetation stress-related signals vary across Swiss National Park using ECOSTRESS-derived raster products. Each product captures a different part of the vegetation-water-energy system. The website organizes outputs into composites, anomalies, short-window trends, variability summaries, preview maps, and provenance files.
