              - generic [ref=e222]: What environmental signals explain the pattern?
              - paragraph [ref=e223]: "ECOSTRESS is a NASA thermal sensor on the International Space Station that measures how land surfaces use water. Each product derived from it captures a different ecological signal: ET as water flux, PET as atmospheric demand, ESI as evaporative stress, NDVI as vegetation greenness, and WUE as efficiency. Together they help explain why one part of the park appears stable while another becomes a watch zone."
